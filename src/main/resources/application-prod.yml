# Production Profile Configuration

# MySQL Database for Production
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/english_learning_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:english_learning_user}
    password: ${DB_PASSWORD:secure_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Connection Pool Configuration
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration for Production
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Production File Storage
file:
  storage:
    base-path: /var/uploads/english-learning
    max-file-size: 200MB

# Production Logging
logging:
  level:
    org.example.docvideoplay: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    root: WARN
  file:
    name: /var/log/english-learning-system.log
    max-size: 100MB
    max-history: 30