      max-lifetime: 1200000
      leak-detection-threshold: 60000
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB

# File Storage Configuration for English Learning Materials
file:
  storage:
    base-path: ./uploads/dev
    documents-path: ${file.storage.base-path}/documents
    videos-path: ${file.storage.base-path}/videos
    articles-path: ${file.storage.base-path}/articles
    max-file-size: 100MB
    allowed-document-types: pdf,doc,docx,txt,rtf
    allowed-video-types: mp4,avi,mov,wmv,flv
    allowed-article-types: html,htm,md

# Logging Configuration
logging:
  level:
    org.example.docvideoplay: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    root: INFO

# Server Configuration
server:
  port: 2001

# English Learning System Specific Configuration
english-learning:
  spaced-repetition:
    initial-interval-days: 1
    initial-ease-factor: 2.5
    minimum-ease-factor: 1.3
    maximum-ease-factor: 2.5
    five-day-reminder: true
  notifications:
    enabled: true
    batch-size: 10
    reminder-hours: 9,14,19