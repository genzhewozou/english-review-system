spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

# File storage configuration for tests
file:
  storage:
    base-path: ${java.io.tmpdir}/english-learning-test
    max-file-size: 10MB
    allowed-video-formats: mp4,avi,mov,webm
    allowed-document-formats: pdf,doc,docx,txt

# Logging configuration for tests
logging:
  level:
    org.example.docvideoplay: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Test-specific configuration
test:
  cleanup:
    enabled: true
  mock:
    external-services: true